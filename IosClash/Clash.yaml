# Last Updated: 2026-11-06 [Clash v1.07]
# mihomo 配置,按 Clash(OmniWide)1.0.13 / 内核 v1.19.33-clash.4 的源码调优,Clash Mi 也能导入,但下面标了 OmniWide 的说法不适用于它。
# 分流基本同 IosStash/Stash.stoverride v3.00,差别:只认纯 IP 连接的嗅探、Apple 17.0.0.0/8 直连、STUN 走代理、隧道接管 IPv6;除 EMBY、Muse 外,各组都多收自建台北两台;自建洛杉矶进除 Claude 外的各组;除 Muse 外,各组都多收悦的台湾家宽;不收新加坡。
# ⚠️ 本仓库公开,下方订阅地址是占位符。导入前换成 Sub-Store 的 Group.yaml 地址(ClashMeta 格式)。

mode: rule
log-level: error
ipv6: true # 只为让隧道接管 IPv6:写 false 时内核会清掉隧道的 IPv6 地址(config/config.go parseIPV6),走 5G 时 IPv6 可能绕过隧道。解析结果仍只给 IPv4,见 dns.ipv6;IPv6-only 节点已被下方订阅白名单排除
allow-lan: false
find-process-mode: off # iOS 没有进程规则,不查进程
unified-delay: false # OmniWide 不写时默认 true,写了才保留。关掉后每次测速少发一个请求,测到的也是新连接真正要等的时间(含握手)
tcp-concurrent: true # 域名解析出多个 IP 时同时连,不用等坏 IP 超时;官方模板也开
disable-keep-alive: true # OmniWide 默认空闲 5 分钟起每 75 秒探测一次(component/keepalive),每条空闲 TCP 都可能单独唤醒蜂窝网络;换网时内核会关掉全部连接,不靠它发现死连接
geo-auto-update: false # 不用 geodata,全部规则走下方 MRS 规则集
profile:
  store-selected: true
  store-fake-ip: true # iOS 可能重启隧道,保留 fake-ip 映射,已有连接不会解析到错误地址
# 只为直接用 IP 连的 App(自带 DNS、写死 IP)识别域名,否则它们会漏过所有域名规则落到 MATCH。
# 走 fake-ip 的连接已经有域名,不会进嗅探(component/sniffer/dispatcher.go shouldOverride),所以平时没有额外开销。
sniffer:
  enable: true
  parse-pure-ip: true
  override-destination: false # 域名只用于匹配规则,实际还连原 IP
  sniff: # 不嗅探 QUIC:要走代理的 QUIC 在下方规则里已被拒绝,App 会退回 TCP
    TLS:
      ports: [443, 8443]
    HTTP:
      ports: [80, 8080]

hosts:
  # BoundaryAI 内网服务,与 PC 一致
  pola.boundaryai.com: 192.168.1.200
  skillhub.boundaryai.cn: 192.168.1.67

# ==========================================
# DNS
# ==========================================
# 走代理的域名靠 fake-ip 不在本机解析,所有 IP 规则也都带 no-resolve(RFC-031),所以默认上游只服务直连域名,国内 UDP 最省。
# 不配 fallback(RFC-031);节点域名单独走 IP 直连的 DoH,运营商看不到机场域名。
dns:
  enable: true
  ipv6: false # App 只拿到 IPv4 解析结果,与上方全局 ipv6 是两回事
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  use-hosts: true
  nameserver:
    - 223.5.5.5
    - 119.29.29.29
  proxy-server-nameserver:
    - https://223.5.5.5/dns-query
    - https://1.12.12.12/dns-query
  nameserver-policy:
    "+.qq.com": 119.29.29.29
    "+.bilibili.com": 119.29.29.29
    "+.taobao.com": 223.5.5.5
    "+.aliyun.com": 223.5.5.5
  fake-ip-filter:
    - "*.lan"
    - "+.local"
    - "+.home.arpa"
    - "stun.*"
    - "+.stun.*.*"
    - "+.stun.*.*.*"
    - "+.ntp.org"
    - "time.*.com"
    - "time.*.gov"
    - "time.*.edu.cn"
    - "time.*.apple.com"
    - "time1.cloud.tencent.com"
    - "*.bambulab.com"
    - "*.bambulab.cn"

# ==========================================
# 远程代理集
# ==========================================
# mihomo 按代理集测速,不按组:
#   - 只要有一个组在用,代理集里的节点每轮全部要测,所以 filter 必须正好是各组成员的并集,多一个就多测一个;
#   - 组上不写 url,否则会给代理集多注册一个测速任务;都用同一个地址,结果才能各组共享。
# 不要为了让空闲组少测而拆代理集:各组成员高度重叠,日常 + Google 就要测 78 个(现在只共 71 个),全用上时 151 个,还要多下载几份订阅。
# 白名单同时挡住裸 SS「自建·<机器>·SS」(不带跳板从手机直接过墙,台北 IP 可能被封)、机场公告节点、IPv6-only 节点。
# v1.07:悦 11 月初去掉了名字末尾的「 · A/B」(Sub-Store 已把名字规范回「悦·🇯🇵日本1」这种写法),
#   「[12] · 」改成「[12]( · |$)」,有无后缀都认;旧写法会把悦的日本、台湾、韩国、美国 1/2 全部滤掉。
proxy-providers:
  组合机场:
    type: http
    url: "https://example.invalid/replace-with-group-yaml-url"
    path: ./providers/group.yaml
    interval: 21600 # 与 Sub-Store 每 6 小时同步 Gist 对齐
    filter: "^(微斯·(🇭🇰|🇨🇳TW|🇯🇵|🇰🇷|🇺🇸).*备用入口$|悦·(🇭🇰|🇺🇸)|悦·(🇯🇵日本|🇹🇼台湾|🇰🇷韩国)[12]( · |$)|悦·🇹🇼台湾家宽[12]|悦·🇯🇵[^·]*AI解锁|一分·(🇭🇰|🇯🇵日本专线|🇹🇼)|自建·(台北[0-9]+|洛杉矶)·Reality$)"
    # 不按协议排除 Hysteria2:2026-11-02 同机场比较,悦差一些、一分更好,家宽数据也不能代表手机。QUIC 连接在用时每 10 秒发一次心跳(sing-quic DefaultKeepAlivePeriod),耗电差多少没测过。
    health-check:
      enable: true
      url: http://www.gstatic.com/generate_204 # HTTP 少一次 TLS 握手
      expected-status: 204
      interval: 1800 # 这只是兜底:OmniWide 在开机、唤醒、换网和连续拨号失败时都会另外测,不用靠定时发现坏节点
      timeout: 3000 # 死节点占着并发名额直到超时,一轮的时间几乎都花在这;2026-11-01 实测活节点超过 3 秒的只有 1/49
      lazy: true

# ==========================================
# 规则集
# ==========================================
# 用 MRS 代替 GEOSITE / GEOIP:9 份合计约 0.6 MB,不必下载 4 MB 的 geosite.dat 和 9 MB 的 geoip.metadb。
# 2026-11-01 同配置实测启动后内存 39.9 MB 对 57.6 MB(LumexCore,Windows,未开测速);iOS 隧道内存有上限,这一项很关键。
# OmniWide 也一样:MRS 是编译好的,不用在隧道里再编译;它的源码记录编译 geosite 峰值 72.7 MiB,隧道预算只有 50 MiB。
# App 没有副本时由内核下载,也走下方规则:平时经 自动选择,节点还没就绪时组为空会走直连,所以不需要单独放行。
# 内容变化慢,每周更新一次;下载失败时内核会按退避自动重试,不用等满一周。
rule-providers:
  cn-site:
    type: http
    behavior: domain
    format: mrs
    url: https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geosite/cn.mrs
    path: ./rules/cn-site.mrs
    interval: 604800
  cn-ip:
    type: http
    behavior: ipcidr
    format: mrs
    url: https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geoip/cn.mrs
    path: ./rules/cn-ip.mrs
    interval: 604800
  apple:
    type: http
    behavior: domain
    format: mrs
    url: https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geosite/apple.mrs
    path: ./rules/apple.mrs
    interval: 604800
  ads:
    type: http
    behavior: domain
    format: mrs
    url: https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geosite/category-ads-all.mrs
    path: ./rules/ads.mrs
    interval: 604800
  openai:
    type: http
    behavior: domain
    format: mrs
    url: https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geosite/openai.mrs
    path: ./rules/openai.mrs
    interval: 604800
  youtube:
    type: http
    behavior: domain
    format: mrs
    url: https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geosite/youtube.mrs
    path: ./rules/youtube.mrs
    interval: 604800
  google:
    type: http
    behavior: domain
    format: mrs
    url: https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geosite/google.mrs
    path: ./rules/google.mrs
    interval: 604800
  ai-chat:
    type: http
    behavior: domain
    format: mrs
    url: https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geosite/category-ai-chat-!cn.mrs
    path: ./rules/ai-chat.mrs
    interval: 604800
  tiktok:
    type: http
    behavior: domain
    format: mrs
    url: https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geosite/tiktok.mrs
    path: ./rules/tiktok.mrs
    interval: 604800

# ==========================================
# 策略组
# ==========================================
proxy-groups:
  - name: 自动选择
    type: url-test
    icon: https://cdn.jsdelivr.net/gh/Orz-3/mini@master/Color/Urltest.png
    use:
      - 组合机场
    filter: "^(微斯·(🇭🇰|🇨🇳TW|🇯🇵|🇰🇷).*备用入口$|悦·🇭🇰|悦·(🇯🇵日本|🇹🇼台湾)[12]( · |$)|悦·🇹🇼台湾家宽[12]|一分·(🇭🇰|🇯🇵日本专线|🇹🇼)|自建·(台北[0-9]+|洛杉矶)·Reality$)"
    tolerance: 100

  # 不收日本(与 PC 一致)和台北两台(VPS 流量有限);不收微斯:它延迟最低但流量有限,视频留给不限量的悦和 0.1 倍率的一分。
  # 收自建洛杉矶(每月 1000GB,与 PC V4.27 一致)。
  - name: EMBY
    type: url-test
    icon: https://cdn.jsdelivr.net/gh/Orz-3/mini@master/Color/Emby.png
    use:
      - 组合机场
    filter: "^(悦·🇭🇰|悦·(🇰🇷韩国|🇹🇼台湾)[12]( · |$)|悦·🇹🇼台湾家宽[12]|一分·(🇭🇰|🇹🇼)|自建·洛杉矶·Reality$)"
    tolerance: 100

  # 比 EMBY 多收台北两台,其余相同,原因也相同:YouTube 走 自动选择 会选中微斯,很快用完它的流量。
  - name: YouTube
    type: url-test
    icon: https://cdn.jsdelivr.net/gh/Orz-3/mini@master/Color/YouTube.png
    use:
      - 组合机场
    filter: "^(悦·🇭🇰|悦·(🇰🇷韩国|🇹🇼台湾)[12]( · |$)|悦·🇹🇼台湾家宽[12]|一分·(🇭🇰|🇹🇼)|自建·(台北[0-9]+|洛杉矶)·Reality$)"
    tolerance: 100

  # Google 与 TikTok 也走本组。不收港澳(Gemini 不可用)和一分(与 PC 一致)。
  # empty-fallback:组被滤空时拒绝连接,不带真实 IP 直连;内核不认识这个字段时会忽略。
  - name: Gemini
    type: url-test
    icon: https://cdn.jsdelivr.net/gh/Orz-3/mini@master/Color/Google.png
    use:
      - 组合机场
    filter: "^(微斯·(🇨🇳TW|🇯🇵|🇺🇸).*备用入口$|悦·(🇯🇵|🇺🇸)[^·]*AI解锁|悦·🇺🇸美国[12]( · |$)|悦·🇹🇼台湾家宽[12]|自建·(台北[0-9]+|洛杉矶)·Reality$)"
    tolerance: 100
    empty-fallback: REJECT

  - name: ChatGPT
    type: url-test
    icon: https://cdn.jsdelivr.net/gh/Orz-3/mini@master/Color/OpenAI.png
    use:
      - 组合机场
    filter: "^(微斯·(🇨🇳TW|🇯🇵|🇺🇸).*备用入口$|悦·(🇯🇵|🇺🇸)[^·]*AI解锁|悦·🇺🇸美国[12]( · |$)|悦·🇹🇼台湾家宽[12]|自建·(台北[0-9]+|洛杉矶)·Reality$)"
    tolerance: 100
    empty-fallback: REJECT

  # 只收台湾出口:台北两台加悦的台湾家宽。PC 上台湾家宽经中转(2026-10-18 家宽直连只有 31~37%),手机不走中转,测不通时 url-test 不会选。
  - name: Claude
    type: url-test
    icon: https://www.google.com/s2/favicons?domain=claude.ai&sz=128
    use:
      - 组合机场
    filter: "^(自建·台北[0-9]+·Reality$|悦·🇹🇼台湾家宽[12])"
    tolerance: 100
    empty-fallback: REJECT

  # 只收美国落地(PC V4.24),含自建洛杉矶。Facebook / Instagram 也走本组(V4.25),保持 Meta 看到的地区一致。
  - name: Muse
    type: url-test
    icon: https://www.google.com/s2/favicons?domain=muse.ai&sz=128
    use:
      - 组合机场
    filter: "^(微斯·🇺🇸.*备用入口$|悦·🇺🇸|自建·洛杉矶·Reality$)"
    tolerance: 100
    empty-fallback: REJECT

  # select 组不定时测速(adapter/outboundgroup/parser.go),这里不用像 Stash 那样关。
  # 这里不接代理集:select 组每次拨号都会 touch 代理集(selector.go),国内连接会让懒加载失效。台北两台已在 自动选择 里。
  - name: 国内
    type: select
    icon: https://cdn.jsdelivr.net/gh/Orz-3/mini@master/Color/CN.png
    proxies:
      - DIRECT
      - 自动选择

# ==========================================
# 规则
# ==========================================
# 落到 MATCH 的都走 自动选择,所以和它同去向的规则都不写,只写例外。
rules:
  # === 局域网 ===
  - IP-CIDR,192.168.0.0/16,DIRECT,no-resolve
  - IP-CIDR,10.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR,172.16.0.0/12,DIRECT,no-resolve
  - IP-CIDR,127.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR,169.254.0.0/16,DIRECT,no-resolve
  - IP-CIDR,224.0.0.0/4,DIRECT,no-resolve
  - DOMAIN-SUFFIX,lan,DIRECT
  - DOMAIN-SUFFIX,local,DIRECT
  - DOMAIN-SUFFIX,home.arpa,DIRECT
  - DOMAIN-SUFFIX,boundaryai.com,DIRECT
  - DOMAIN-SUFFIX,boundaryai.cn,DIRECT

  # === 苹果:iOS 后台流量最大头。前三条保证规则集还没下载时也直连 ===
  - DOMAIN-SUFFIX,apple.com,DIRECT
  - DOMAIN-SUFFIX,icloud.com,DIRECT
  - DOMAIN-SUFFIX,mzstatic.com,DIRECT
  - RULE-SET,apple,DIRECT
  - IP-CIDR,17.0.0.0/8,DIRECT,no-resolve # 整段属于 Apple;5223 推送端口嗅探不到域名,直接用 IP 连时也不绕节点

  # === Emby ===
  - DOMAIN,tv.ash.yt,EMBY # AshEmby
  - DOMAIN,ask.ash.yt,EMBY # Ask AshS
  - DOMAIN,emby.bangumi.ca,EMBY # Nyamedia:公益
  - DOMAIN,1.eoos.lol,EMBY # eoos
  - DOMAIN,v1.uhdnow.com,EMBY # UHD
  - DOMAIN,emby-cm.hohai.eu.org,EMBY # honhai:公费
  - DOMAIN,emby-npo.hohai.eu.org,EMBY # hohai:公益
  - DOMAIN,us01.doudou.pet,EMBY # Ryan:公益
  - DOMAIN-SUFFIX,startspoint.com,EMBY # 起点公费A
  - DOMAIN-SUFFIX,mobaiemby.site,EMBY # 墨云阁:公益30天保号
  - DOMAIN-SUFFIX,yue.to,EMBY # 悦:stream.yue.to
  - DOMAIN-SUFFIX,28.al,EMBY # 起点:公益2-30天保号
  # Emby 直连服
  - DOMAIN-SUFFIX,xmsl.org,DIRECT # 1111:公费
  - DOMAIN-SUFFIX,1huanlesap02.top,DIRECT # 起点:Pro
  - DOMAIN-SUFFIX,yfjc.xyz,DIRECT

  # === 自定义直连 ===
  - DOMAIN-SUFFIX,1145145.com,DIRECT
  - DOMAIN-SUFFIX,bambulab.com,DIRECT
  - DOMAIN-SUFFIX,bambulab.cn,DIRECT
  - DOMAIN-SUFFIX,bambulab.co,DIRECT
  - DOMAIN,cn.bing.com,DIRECT # 修复 Bing 重定向循环
  - DOMAIN-SUFFIX,speedtest.net,DIRECT
  - DOMAIN-SUFFIX,ookla.com,DIRECT

  # === 拦截 QUIC:只拦要走代理的。国内 QUIC 照常直连,不必被拒后再重试一次 TCP ===
  - AND,((NETWORK,UDP),(DST-PORT,443),(NOT,((RULE-SET,cn-site))),(NOT,((RULE-SET,cn-ip,no-resolve)))),REJECT

  # === 广告 ===
  - RULE-SET,ads,REJECT

  # === OpenAI ===
  - DOMAIN-SUFFIX,openai.com,ChatGPT
  - DOMAIN-SUFFIX,chatgpt.com,ChatGPT
  - DOMAIN-SUFFIX,oaistatic.com,ChatGPT
  - DOMAIN-SUFFIX,oaiusercontent.com,ChatGPT
  - DOMAIN-SUFFIX,sora.com,ChatGPT
  - RULE-SET,openai,ChatGPT

  # === Anthropic(含 Intercom、Statsig,与 PC 一致);grok 也走本组 ===
  - DOMAIN-SUFFIX,anthropic.com,Claude
  - DOMAIN-SUFFIX,claude.ai,Claude
  - DOMAIN-SUFFIX,claude.com,Claude
  - DOMAIN-SUFFIX,claudeapi.com,Claude
  - DOMAIN-SUFFIX,claudeapp.com,Claude
  - DOMAIN-SUFFIX,claudepro.com,Claude
  - DOMAIN-SUFFIX,mcp.exa.ai,Claude
  - DOMAIN-SUFFIX,intercom.io,Claude
  - DOMAIN-SUFFIX,intercomassets.com,Claude
  - DOMAIN-SUFFIX,intercomcdn.com,Claude
  - DOMAIN-SUFFIX,statsig.com,Claude
  - DOMAIN-SUFFIX,statsigapi.net,Claude
  - DOMAIN-SUFFIX,grok.com,Claude

  # === Meta Muse ===
  - DOMAIN-SUFFIX,muse.ai,Muse
  - DOMAIN-SUFFIX,museai.com,Muse
  - DOMAIN-SUFFIX,meta.ai,Muse
  - DOMAIN-SUFFIX,auth.meta.com,Muse
  - DOMAIN-SUFFIX,fbcdn.net,Muse
  - DOMAIN-SUFFIX,facebook.com,Muse
  - DOMAIN-SUFFIX,instagram.com,Muse
  - DOMAIN-SUFFIX,hatch.club,Muse
  - DOMAIN-SUFFIX,ecto1.ai,Muse

  # === Google:YouTube 排在前面,免得被 google 规则集截走 ===
  - RULE-SET,youtube,YouTube
  - DOMAIN-SUFFIX,googleapis.cn,Gemini
  - DOMAIN-SUFFIX,deepmind.com,Gemini
  - DOMAIN-SUFFIX,deepmind.google,Gemini
  - RULE-SET,google,Gemini
  - RULE-SET,ai-chat,Gemini
  - RULE-SET,tiktok,Gemini

  # === WebRTC:网页不需要任何权限就能让浏览器打 STUN,直连会暴露真实出口(RFC-031 §8)。mihomo 没有 PROTOCOL,按常用端口走代理;123 也算在内,网页可以把 STUN 放在上面 ===
  # 必须排在国内规则前面,国内 STUN 同样会暴露。节点不支持 UDP 时内核会跳过第一条(tunnel/tunnel.go),第二条拒绝,不落回直连。
  # FaceTime 连 Apple 的部分已在上方 17.0.0.0/8 直连。手机没有进程规则,国内服务器的非标准端口挡不住。
  - AND,((NETWORK,UDP),(DST-PORT,123/3478-3497/19302-19309)),自动选择
  - AND,((NETWORK,UDP),(DST-PORT,123/3478-3497/19302-19309)),REJECT

  # === 兜底 ===
  - RULE-SET,cn-site,国内
  - RULE-SET,cn-ip,国内,no-resolve
  - MATCH,自动选择
